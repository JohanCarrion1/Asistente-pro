workflows:
  kivy-android:
    name: Asistente Pro
    instance_type: linux
    max_build_duration: 60
    environment:
      vars:
        APP_NAME: AsistentePro
        PACKAGE_DOMAIN: org.asistentepro
    scripts:
      - name: Install system dependencies
        script: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev libjpeg-dev zlib1g-dev autoconf automake libtool pkg-config openjdk-17-jdk
      - name: Accept ALL Android licenses
        script: |
          mkdir -p $ANDROID_HOME/licenses
          yes y | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Install build-tools
        script: |
          yes y | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;30.0.3" "platforms;android-30" "platform-tools"
      - name: Install dependencies
        script: |
          pip3 install setuptools
          pip3 install buildozer==1.5.0 cython==0.29.36
      - name: Build APK
        script: |
          cd $CM_BUILD_DIR
          rm -rf .buildozer
          buildozer android debug
    artifacts:
      - buildozer/bin/*.apk