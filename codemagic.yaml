workflows:
  kivy-android:
    name: Asistente Pro
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      vars:
        APP_NAME: AsistentePro
        PACKAGE_DOMAIN: org.asistentepro
    scripts:
      - name: Accept ALL Android licenses
        script: |
          mkdir -p $ANDROID_HOME/licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Install ONLY build-tools 30.0.3
        script: |
          # SOLO instalamos 30.0.3, NO 37.0.0
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;30.0.3" "platforms;android-30" "platform-tools"
          # Verificar que se instaló
          ls $ANDROID_HOME/build-tools/
      - name: Install dependencies
        script: |
          pip3 install setuptools
          pip3 install buildozer==1.5.0 cython==0.29.36
      - name: Build APK
        script: |
          cd $CM_BUILD_DIR
          rm -rf .buildozer
          buildozer android debug
    artifacts:
      - buildozer/bin/*.apk