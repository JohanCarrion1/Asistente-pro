workflows:
  kivy-android:
    name: Asistente Pro
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      vars:
        APP_NAME: AsistentePro
        PACKAGE_DOMAIN: org.asistentepro
    scripts:
      - name: Accept Android licenses
        script: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
      - name: Install build-tools 30.0.3 manually
        script: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;30.0.3" "platforms;android-30" "platform-tools"
      - name: Install dependencies
        script: |
          pip3 install setuptools
          pip3 install buildozer==1.5.0 cython==0.29.36
      - name: Build APK
        script: |
          cd $CM_BUILD_DIR
          buildozer android debug
    artifacts:
      - buildozer/bin/*.apk