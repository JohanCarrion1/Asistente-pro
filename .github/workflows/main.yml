name: Build Asistente Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev libssl-dev libjpeg-dev zlib1g-dev autoconf automake libtool pkg-config openjdk-17-jdk
    
    - name: Install Buildozer
      run: pip install buildozer==1.5.0 cython==0.29.36 setuptools
    
    - name: Install Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Accept licenses and install build-tools
      run: |
        mkdir -p $ANDROID_HOME/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;30.0.3" "platforms;android-30" "platform-tools"
    
    - name: Force Buildozer to use build-tools 30.0.3
      run: |
        # Modificar el código de Buildozer para forzar la versión
        BUILDORIZER_PATH=$(python3 -c "import buildozer; print(buildozer.__file__)" | sed 's/__init__.py//')
        sed -i 's/"build-tools", self.android_api/"build-tools", "30.0.3"/g' ${BUILDORIZER_PATH}targets/android.py || true
        sed -i "s/'build-tools', self.android_api/'build-tools', '30.0.3'/g" ${BUILDORIZER_PATH}targets/android.py || true
    
    - name: Build APK
      run: |
        cd $GITHUB_WORKSPACE
        rm -rf .buildozer
        buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: asistente-pro-apk
        path: bin/*.apk