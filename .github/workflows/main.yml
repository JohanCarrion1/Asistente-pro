name: Build Asistente Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev libssl-dev libjpeg-dev zlib1g-dev autoconf automake libtool pkg-config openjdk-17-jdk
    
    - name: Install Buildozer
      run: |
        pip install buildozer==1.5.0 cython==0.29.36 setuptools
    
    - name: Install Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Accept licenses
      run: |
        mkdir -p $ANDROID_HOME/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
        echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> $ANDROID_HOME/licenses/android-sdk-license
        yes | sdkmanager --licenses || true
    
    - name: Install build-tools in Buildozer's SDK folder
      run: |
        # ESTA ES LA CLAVE: instalar en la carpeta que Buildozer usa
        BUILDOZER_SDK="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p "$BUILDOZER_SDK/licenses"
        
        # Copiar licencias a la carpeta de Buildozer
        cp -r $ANDROID_HOME/licenses/* "$BUILDOZER_SDK/licenses/"
        
        # Instalar build-tools 37.0.0 en la carpeta de Buildozer
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root="$BUILDOZER_SDK" "build-tools;37.0.0" "platforms;android-33" "platform-tools"
        
        # Verificar
        ls -la "$BUILDOZER_SDK/build-tools/"
    
    - name: Build APK
      run: |
        cd $GITHUB_WORKSPACE
        rm -rf .buildozer/android/platform/build*
        buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: asistente-pro-apk
        path: bin/*.apk