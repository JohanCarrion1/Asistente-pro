name: Asistente Pro - Android nativo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Mantener firma compatible entre APKs
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: asistente-pro-debug-keystore-v1
      - name: Pruebas, vistas y APK nativo
        run: |
          chmod +x gradlew
          ./gradlew :app:recordPaparazziDebug :app:lintDebug :app:assembleDebug --console=plain --stacktrace
      - name: Verificar firma del APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: asistente-pro-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Subir capturas y pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asistente-pro-vistas-y-pruebas
          path: |
            app/build/reports/
            app/src/test/snapshots/images/
          if-no-files-found: ignore
          retention-days: 30
