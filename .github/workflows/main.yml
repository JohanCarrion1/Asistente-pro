name: Build Asistente Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev libssl-dev libjpeg-dev zlib1g-dev \
          autoconf automake libtool pkg-config openjdk-17-jdk git zip unzip \
          libncurses5-dev libncursesw5-dev cmake

    - name: Install buildozer & cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: Build APK
      run: |
        cd $GITHUB_WORKSPACE
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: asistente-pro-apk
        path: bin/*.apk