name: Build Asistente Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build Kivy APK
      uses: nick-fields/retry@v2
      with:
        timeout_minutes: 60
        max_attempts: 1
        command: |
          docker run -v ${{ github.workspace }}:/app -w /app \
            -e APP_NAME="AsistentePro" \
            -e PACKAGE_DOMAIN="org.asistentepro" \
            kivy/buildozer:stable android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: asistente-pro-apk
        path: bin/*.apk