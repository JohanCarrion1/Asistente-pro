name: Build Asistente Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libffi-dev \
          libssl-dev \
          libjpeg-dev \
          zlib1g-dev \
          autoconf \
          automake \
          libtool \
          pkg-config \
          openjdk-17-jdk
    
    - name: Install Buildozer
      run: |
        pip install buildozer cython
    
    - name: Configure Buildozer
      run: |
        # Desactivar warning de root
        sed -i 's/warn_on_root = 1/warn_on_root = 0/g' buildozer.spec
        
        # Simplificar requirements
        sed -i 's/requirements = python3,kivy==2.3.1,flask==3.1.3,requests==2.34.2,SpeechRecognition==3.17.0,gTTS==2.5.4,pydub==0.25.1,Pillow==12.3.0,psutil==7.2.2/requirements = python3,kivy/g' buildozer.spec
        
        # Forzar versión de Android API y build-tools
        sed -i 's/android.api = 33/android.api = 30/g' buildozer.spec
        sed -i 's/android.minapi = 26/android.minapi = 21/g' buildozer.spec
        
        # Agregar línea para forzar build-tools específicos
        echo "" >> buildozer.spec
        echo "android.sdk = 30" >> buildozer.spec
        echo "android.ndk = 25b" >> buildozer.spec
    
    - name: Install Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Accept ALL Android licenses manually
      run: |
        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
        echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" >> $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-preview-license
        
        # Instalar build-tools 30.0.3 específicamente
        sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"
    
    - name: Build APK
      run: |
        buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: asistente-pro-apk
        path: bin/*.apk
