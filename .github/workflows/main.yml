name: Build Asistente Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libffi-dev \
          libssl-dev \
          libjpeg-dev \
          zlib1g-dev \
          autoconf \
          automake \
          libtool \
          pkg-config \
          openjdk-17-jdk \
          wget \
          unzip
    
    - name: Install Buildozer
      run: |
        pip install buildozer==1.5.0 cython==0.29.36 setuptools
    
    - name: Set JAVA_HOME
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV
        echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV
    
    - name: Build APK with verbose logging
      run: |
        cd $GITHUB_WORKSPACE
        rm -rf .buildozer
        # Ejecutar buildozer con log_level=2 para ver errores detallados
        sed -i 's/log_level = 2/log_level = 2/g' buildozer.spec || true
        buildozer android debug
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: asistente-pro-apk
        path: bin/*.apk