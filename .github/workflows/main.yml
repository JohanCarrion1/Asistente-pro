name: Build Asistente Pro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup             /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -a -f > /dev/null 2>&1 || true
          df -h /

      - name: Anadir swap extra (evita OOM al compilar CPython/recipes)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile || true
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile || true
          free -h

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip patch \
            autoconf automake libtool libtool-bin libltdl-dev autoconf-archive \
            pkg-config cmake ccache \
            libffi-dev libssl-dev libjpeg-dev zlib1g-dev \
            libncurses-dev libncurses5-dev libncursesw5-dev

      - name: Instalar Buildozer y Cython (combinacion recomendada por Kivy)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer" "cython==0.29.34"
          buildozer --version

      - name: Limpiar compilaciones anteriores
        run: |
          rm -rf .buildozer bin

      - name: Compilar APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer_log.txt

      - name: Subir log de compilacion si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log-fallo
          path: buildozer_log.txt
          if-no-files-found: ignore

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: asistente-pro-apk
          path: bin/*.apk
          if-no-files-found: error
