name: Build Asistente Pro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v4

      - name: Liberar espacio en disco
        id: disco
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup \
            /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -a -f > /dev/null 2>&1 || true
          df -h /

      - name: Anadir swap extra (evita OOM al compilar CPython/recipes)
        id: swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile || true
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile || true
          free -h

      - name: Configurar Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias del sistema
        id: apt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip patch \
            autoconf automake libtool libtool-bin libltdl-dev autoconf-archive \
            pkg-config cmake ccache \
            libffi-dev libssl-dev libjpeg-dev zlib1g-dev \
            libncurses-dev libncurses5-dev libncursesw5-dev

      - name: Instalar Buildozer y Cython (combinacion recomendada por Kivy)
        id: pip
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer" "cython==0.29.34"
          buildozer --version

      - name: Limpiar compilaciones anteriores
        id: clean
        run: |
          rm -rf .buildozer bin

      - name: Compilar APK
        id: buildozer
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer_log.txt

      - name: Subir log de compilacion si falla
        id: logfail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log-fallo
          path: buildozer_log.txt
          if-no-files-found: ignore

      - name: Reportar fallo en issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          DISCO: ${{ steps.disco.outcome }}
          SWAP: ${{ steps.swap.outcome }}
          PYTHON: ${{ steps.python.outcome }}
          JAVA: ${{ steps.java.outcome }}
          APT: ${{ steps.apt.outcome }}
          PIP: ${{ steps.pip.outcome }}
          BUILD: ${{ steps.buildozer.outcome }}
        run: |
          {
            echo "La compilacion del APK fallo en el run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo ""
            echo "**Estado de los pasos:**"
            echo "| Paso | Resultado |"
            echo "| --- | --- |"
            echo "| checkout | ${CHECKOUT} |"
            echo "| liberar disco | ${DISCO} |"
            echo "| swap | ${SWAP} |"
            echo "| python | ${PYTHON} |"
            echo "| java | ${JAVA} |"
            echo "| apt | ${APT} |"
            echo "| pip/buildozer | ${PIP} |"
            echo "| **compilar APK** | ${BUILD} |"
            echo ""
            echo "**Ultimas 200 lineas del log (buildozer_log.txt):**"
            printf '\n```\n'
            tail -n 200 buildozer_log.txt 2>/dev/null || echo "(no hay log)"
            printf '\n```\n'
          } > issue_body.md
          gh issue create \
            --title "CI fallo: run #${{ github.run_number }}" \
            --body-file issue_body.md

      - name: Reportar exito en issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "CI OK: APK compilado (run #${{ github.run_number }})" \
            --body "El APK se compilo correctamente y quedo como artefacto \`asistente-pro-apk\` en el run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: asistente-pro-apk
          path: bin/*.apk
          if-no-files-found: error
