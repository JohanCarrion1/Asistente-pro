name: Build Asistente Pro APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip patch autoconf automake libtool libtool-bin \
            libltdl-dev pkg-config cmake ccache libffi-dev libssl-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          python -m pip install 'buildozer==1.5.0' 'Cython==0.29.36'
      - name: Verificar codigo y backend
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q main.py app.py backend tests
          python -m unittest discover -s tests -v
      - name: Conservar firma debug entre compilaciones
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: asistente-pro-debug-keystore-v1
      - name: Preparar SDK y build-tools compatibles
        run: |
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
          mkdir -p .android-sdk
          unzip -q /tmp/android-tools.zip -d .android-sdk
          mv .android-sdk/cmdline-tools .android-sdk/tools
          mkdir -p .android-sdk/cmdline-tools
          mv .android-sdk/tools .android-sdk/cmdline-tools/latest
          ln -s cmdline-tools/latest .android-sdk/tools
          set +o pipefail
          yes | .android-sdk/tools/bin/sdkmanager --sdk_root="$PWD/.android-sdk" --licenses > /dev/null
          set -o pipefail
          .android-sdk/tools/bin/sdkmanager --sdk_root="$PWD/.android-sdk" 'platform-tools' 'platforms;android-33' 'build-tools;33.0.2' 'build-tools;30.0.3'
      - name: Compilar APK
        run: |
          set -o pipefail
          export ANDROID_HOME="$PWD/.android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          buildozer -v android debug 2>&1 | tee buildozer_log.txt
      - name: Subir APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: asistente-pro-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Subir log si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log-fallo
          path: buildozer_log.txt
          if-no-files-found: ignore
