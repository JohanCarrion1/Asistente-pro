name: Build Asistente Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev libssl-dev libjpeg-dev zlib1g-dev autoconf automake libtool pkg-config openjdk-17-jdk
    
    - name: Install Buildozer
      run: |
        pip install buildozer==1.5.0 cython==0.29.36 setuptools
    
    - name: Install Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Accept licenses and install build-tools
      run: |
        mkdir -p $ANDROID_HOME/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
        yes | sdkmanager --licenses || true
        sdkmanager "build-tools;30.0.3" "platforms;android-30" "platform-tools"
    
    - name: Patch Buildozer to force build-tools 30.0.3
      run: |
        # Encontrar la ruta de buildozer
        BUILDORIZER_SITE_PACKAGES=$(python3 -c "import site; print(site.getsitepackages()[0])")
        BUILDORIZER_ANDROID="${BUILDORIZER_SITE_PACKAGES}/buildozer/targets/android.py"
        
        echo "Patching Buildozer at: ${BUILDORIZER_ANDROID}"
        
        # Crear backup
        cp "${BUILDORIZER_ANDROID}" "${BUILDORIZER_ANDROID}.bak"
        
        # Reemplazar la línea que define build-tools
        sed -i 's/self\.android_api, self\.android_minapi/"30.0.3", self.android_minapi/g' "${BUILDORIZER_ANDROID}"
        
        # También parchear la función get_available_packages
        sed -i 's/("build-tools", build_tool_version)/("build-tools", "30.0.3")/g' "${BUILDORIZER_ANDROID}"
        
        echo "Buildozer patched successfully"
        cat "${BUILDORIZER_ANDROID}" | grep -A2 -B2 "build-tools" || true
    
    - name: Build APK
      run: |
        cd $GITHUB_WORKSPACE
        rm -rf .buildozer
        buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: asistente-pro-apk
        path: bin/*.apk